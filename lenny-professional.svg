<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Professional Lenny Avatar</title>
  <desc id="desc">A minimalist professional avatar version of the Lenny face: circular face, composed neutral smile, simple suit and tie, flat modern colors and clean lines.</desc>
  <defs>
    <linearGradient id="faceGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#FFF9EA" />
      <stop offset="100%" stop-color="#FFE8A8" />
    </linearGradient>
    <linearGradient id="suitGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#2B2F4A" />
      <stop offset="100%" stop-color="#202336" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- background -->
  <rect width="100%" height="100%" fill="#F4F6FA" />

  <!-- suit -->
  <g transform="translate(0,220)">
    <path d="M128 704 L896 704 L704 352 L320 352 Z" fill="url(#suitGrad)" filter="url(#shadow)" />

    <!-- lapels -->
    <path d="M320 352 L512 528 L384 528 Z" fill="#1F2536" opacity="0.95" />
    <path d="M704 352 L512 528 L640 528 Z" fill="#1F2536" opacity="0.95" />

    <!-- tie -->
    <path d="M488 528 L536 528 L512 672 Z" fill="#CE2E5A" />
    <rect x="496" y="440" width="32" height="120" rx="4" ry="4" fill="#CE2E5A" transform="translate(-0.5,0)" />
  </g>

  <!-- face circle -->
  <g transform="translate(0,40)">
    <circle cx="512" cy="360" r="280" fill="url(#faceGrad)" stroke="#E6C57A" stroke-width="6" />

    <!-- subtle inner highlight -->
    <ellipse cx="430" cy="300" rx="120" ry="80" fill="rgba(255,255,255,0.25)" />

    <!-- eyes -->
    <ellipse cx="420" cy="340" rx="26" ry="34" fill="#22222A" />
    <ellipse cx="604" cy="340" rx="26" ry="34" fill="#22222A" />

    <!-- refined Lenny-style mouth (professional, subtle) -->
    <path d="M400 420 C 460 480, 564 480, 624 420" stroke="#2B2F4A" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round" />

    <!-- eyebrows (neutral confident) -->
    <path d="M370 300 Q420 270 470 300" stroke="#2B2F4A" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.9" />
    <path d="M554 300 Q604 270 654 300" stroke="#2B2F4A" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.9" />

    <!-- glasses (optional professional touch) -->
    <g fill="none" stroke="#2B2F4A" stroke-width="8" stroke-linecap="round">
      <rect x="372" y="300" width="110" height="72" rx="18" />
      <rect x="540" y="300" width="110" height="72" rx="18" />
      <path d="M482 336 L540 336" />
    </g>

    <!-- chin shadow -->
    <path d="M360 580 C 450 620, 574 620, 664 580" fill="#000" opacity="0.04" />
  </g>

  <!-- small signature mark -->
  <text x="820" y="980" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#9AA0B2">lenny • professional</text>
</svg>
